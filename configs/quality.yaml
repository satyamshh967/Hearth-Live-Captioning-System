# Hearth Configuration: Quality Profile (Dedicated GPU / High-end Multicore)
profile: quality

asr:
  provider: faster_whisper
  model_size: small
  device: auto # GPU if CUDA available, else CPU
  compute_type: float16
  beam_size: 5
  language: null # Auto-detect per utterance for code-switching
  initial_prompt: ""
  vad_filter: true
  min_silence_duration_ms: 250
  chunk_duration_sec: 2.0

diarization:
  provider: lightweight_centroid
  min_speakers: 1
  max_speakers: 8
  similarity_threshold: 0.70
  embedding_dimension: 128

llm:
  provider: openai_local
  endpoint: "http://localhost:11434/v1"
  model: "qwen2.5:7b"
  timeout_sec: 3.5
  temperature: 0.1

tts:
  provider: web_speech_fallback
  voice: "en-IN"

privacy:
  store_audio: false
  transcript_retention_days: 14
  allow_network_telemetry: false
