name: Hearth CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Unit Tests & Offline Privacy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Audio Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/core/requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Build Web PWA Bundle
      run: |
        cd apps/web
        npm ci
        npm run build

    - name: Run Test Suite (with HEARTH_MOCK_ASR for fast CI)
      env:
        HEARTH_MOCK_ASR: "true"
      run: |
        python -m pytest tests/ -v

    - name: Run Offline Intent Smoke Test
      run: |
        python -c "
        import asyncio
        from eval.run_eval import evaluate_intent_dataset
        from pathlib import Path
        asyncio.run(evaluate_intent_dataset(Path('eval/intent_test_dataset.json')))
        "
